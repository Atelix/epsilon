# Version updates are grouped into one pull request per ecosystem and month.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    labels:
      - "dependencies"
    schedule:
      interval: "monthly"
    groups:
      monthly-version-updates:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    labels:
      - "dependencies"
    schedule:
      interval: "monthly"
    groups:
      monthly-version-updates:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/Epsilon.Host.Frontend"
    target-branch: "main"
    labels:
      - "dependencies"
    schedule:
      interval: "monthly"
    groups:
      monthly-version-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/Epsilon.Host.Frontend"
    target-branch: "main"
    labels:
      - "dependencies"
    schedule:
      interval: "monthly"
    groups:
      monthly-version-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/Epsilon.Host.WebApi"
    target-branch: "main"
    labels:
      - "dependencies"
    schedule:
      interval: "monthly"
    groups:
      monthly-version-updates:
        patterns:
          - "*"
